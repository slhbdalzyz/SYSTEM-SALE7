name: Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["apps/desktop/**", "apps/web/**", "packages/shared/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "API address the app talks to (empty = the demo shop built into the app)"
        required: false

jobs:
  # The serial-port code is tested on Linux, where socat can stand in for a scale.
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y socat libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Placeholder web build for tauri::generate_context
        run: mkdir -p apps/web/dist-demo && echo '<!doctype html>' > apps/web/dist-demo/index.html
      - run: cargo test --lib
        working-directory: apps/desktop/src-tauri

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build the installer
        shell: bash
        working-directory: apps/desktop
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          if [ -n "$API_URL" ]; then
            # A real shop: talk to its server, and package the normal web build.
            export VITE_API_URL="$API_URL"
            sed -i 's#dist-demo#dist#' src-tauri/tauri.conf.json
          else
            export VITE_DEMO=1
          fi
          pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: sale7-pos-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
