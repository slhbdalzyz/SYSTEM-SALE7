[package]
name = "pos-desktop"
version = "0.5.0"
edition = "2021"

[lib]
name = "pos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# No libudev: port names and USB details are enough, and it keeps the Linux CI build simple.
serialport = { version = "4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
